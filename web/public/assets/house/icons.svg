<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!--
    Marks for the eight house games. Drawn here rather than lifted from any
    casino: a casino's Dice screenshot is that casino's artwork, and the site
    reviews eight games that every casino draws differently. Each symbol is a
    48x48 geometric mark in currentColor, so the page sets the colour and the
    same file serves a 30px header tile and a 52px card tile.
  -->

  <!-- Dice: one die, five pips. -->
  <symbol id="dice" viewBox="0 0 48 48">
    <rect x="8" y="8" width="32" height="32" rx="7" fill="none" stroke="currentColor" stroke-width="3"/>
    <circle cx="17" cy="17" r="3" fill="currentColor"/>
    <circle cx="31" cy="17" r="3" fill="currentColor"/>
    <circle cx="24" cy="24" r="3" fill="currentColor"/>
    <circle cx="17" cy="31" r="3" fill="currentColor"/>
    <circle cx="31" cy="31" r="3" fill="currentColor"/>
  </symbol>

  <!-- Crash: the multiplier curve, and the point it stops. -->
  <symbol id="crash" viewBox="0 0 48 48">
    <path d="M8 38 C 18 36, 26 30, 34 14" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M8 38 H 40" fill="none" stroke="currentColor" stroke-width="2" stroke-opacity=".45" stroke-linecap="round"/>
    <circle cx="35" cy="12" r="4" fill="currentColor"/>
    <path d="M30 7 L40 17 M40 7 L30 17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-opacity=".7"/>
  </symbol>

  <!-- Plinko: the peg field and the ball at the top. -->
  <symbol id="plinko" viewBox="0 0 48 48">
    <circle cx="24" cy="8" r="3.5" fill="currentColor"/>
    <g fill="currentColor" fill-opacity=".8">
      <circle cx="20" cy="19" r="2"/><circle cx="28" cy="19" r="2"/>
      <circle cx="16" cy="27" r="2"/><circle cx="24" cy="27" r="2"/><circle cx="32" cy="27" r="2"/>
      <circle cx="12" cy="35" r="2"/><circle cx="20" cy="35" r="2"/><circle cx="28" cy="35" r="2"/><circle cx="36" cy="35" r="2"/>
    </g>
    <path d="M8 42 H40" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-opacity=".5"/>
  </symbol>

  <!-- Mines: the grid, one tile turned, one mine. -->
  <symbol id="mines" viewBox="0 0 48 48">
    <g fill="none" stroke="currentColor" stroke-width="2.5">
      <rect x="8" y="8" width="9" height="9" rx="2"/><rect x="19.5" y="8" width="9" height="9" rx="2"/><rect x="31" y="8" width="9" height="9" rx="2"/>
      <rect x="8" y="19.5" width="9" height="9" rx="2"/><rect x="31" y="19.5" width="9" height="9" rx="2"/>
      <rect x="8" y="31" width="9" height="9" rx="2"/><rect x="19.5" y="31" width="9" height="9" rx="2"/><rect x="31" y="31" width="9" height="9" rx="2"/>
    </g>
    <circle cx="24" cy="24" r="4.5" fill="currentColor"/>
    <path d="M24 17 V14 M24 34 V31 M17 24 H14 M34 24 H31" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- Limbo: the target line and the arrow that has to clear it. -->
  <symbol id="limbo" viewBox="0 0 48 48">
    <path d="M10 16 H38" stroke="currentColor" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round" stroke-opacity=".7"/>
    <path d="M24 40 V12" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M15 21 L24 10 L33 21" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Keno: the number card with a handful picked. -->
  <symbol id="keno" viewBox="0 0 48 48">
    <rect x="7" y="7" width="34" height="34" rx="6" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <g fill="currentColor" fill-opacity=".35">
      <circle cx="15" cy="15" r="2.6"/><circle cx="24" cy="15" r="2.6"/><circle cx="33" cy="15" r="2.6"/>
      <circle cx="15" cy="24" r="2.6"/><circle cx="33" cy="24" r="2.6"/>
      <circle cx="15" cy="33" r="2.6"/><circle cx="24" cy="33" r="2.6"/>
    </g>
    <g fill="currentColor">
      <circle cx="24" cy="24" r="3.4"/><circle cx="33" cy="33" r="3.4"/><circle cx="24" cy="15" r="3.4"/>
    </g>
  </symbol>

  <!-- Hi-Lo: a card and the two arrows the bet is between. -->
  <symbol id="hi-lo" viewBox="0 0 48 48">
    <rect x="9" y="7" width="22" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <text x="20" y="27" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="currentColor">7</text>
    <path d="M38 12 L41 16 M38 12 L35 16 M38 12 V22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M38 36 L41 32 M38 36 L35 32 M38 36 V26" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Wheel: segments and the pointer. -->
  <symbol id="wheel" viewBox="0 0 48 48">
    <circle cx="24" cy="26" r="15" fill="none" stroke="currentColor" stroke-width="3"/>
    <g stroke="currentColor" stroke-width="2" stroke-opacity=".7">
      <path d="M24 11 V41"/><path d="M9 26 H39"/><path d="M13.4 15.4 L34.6 36.6"/><path d="M34.6 15.4 L13.4 36.6"/>
    </g>
    <circle cx="24" cy="26" r="3.5" fill="currentColor"/>
    <path d="M20 5 L28 5 L24 11 Z" fill="currentColor"/>
  </symbol>
</svg>
